# Render Blueprint - LAUMOLOGY (web + auto-scanner in-process)
# Deploy: Render Dashboard -> New -> Blueprint -> pilih repo ini.
# Catatan: plan free akan "spin down" saat idle (scanner ikut pause).
# Untuk 24/7 penuh, pakai plan berbayar atau ping berkala ke /health.
services:
  - type: web
    name: laumology
    runtime: python
    plan: free
    region: singapore
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 webapp:app
    envVars:
      # Auto-scanner berjalan di dalam proses web (thread) tiap SCAN_INTERVAL detik
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: SCAN_INTERVAL
        value: "900"
      - key: SCAN_UNIVERSE
        value: "lq45"
      - key: SCAN_WINDOW
        value: "market"
      - key: SCAN_START_DELAY
        value: "90"
      - key: WARM_UNIVERSE
        value: "auto"
      - key: WARM_INTERVAL
        value: "1800"
      - key: RATE_LIMIT_PER_MIN
        value: "600"
      # Base URL kanonik publik (WAJIB absolut). Dipakai untuk canonical/sitemap
      # dan og:image/twitter:image; tanpa ini kartu berbagi FB/X/WA jadi relatif
      # alias kosong. Sesuaikan bila domain kustom dipakai.
      - key: LAUM_PUBLIC_BASE_URL
        value: https://laumology.onrender.com
      # Batas ukuran body request (byte) untuk semua endpoint; default 1 MB.
      - key: LAUM_MAX_BODY_BYTES
        value: "1048576"
      # Render menaruh IP klien asli di ujung kanan X-Forwarded-For (1 hop LB).
      # Aktifkan ProxyFix agar rate-limit per-klien, bukan global satu IP proxy.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Isi lewat dashboard (sync: false = minta input, tidak disimpan di repo)
      - key: API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: IDX_ALERT_WEBHOOK
        sync: false

